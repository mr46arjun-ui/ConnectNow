services:
  - type: web
    name: connectnow
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_DB_MIGRATIONS
        value: "true"
      - key: DB_MIGRATION_ATTEMPTS
        value: "10"
      - key: TRUST_PROXY
        value: "1"
      - key: VITE_ENABLE_OAUTH
        value: "false"
